---

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: [ "sleep", "infinity" ]
  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    volumes:
      - DB:/var/lib/postgresql
      - ./docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  DB:
