---

services:
  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    volumes:
      - DB:/var/lib/postgresql
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_NAME}" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  DB:
